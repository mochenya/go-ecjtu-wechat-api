name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: 检查版本标签
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: 运行发布门禁
        run: make gate
      - name: 构建并打包
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="ecjtu_${VERSION}_${os}_${arch}"
            mkdir -p "dist/$name"
            binary=ecjtu
            if [ "$os" = windows ]; then binary=ecjtu.exe; fi
            GOOS="$os" GOARCH="$arch" make release VERSION="$VERSION" BUILD_TIME="$build_time" BIN="dist/$name/$binary"
            cp README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum ./*.zip ./*.tar.gz > checksums.txt)
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --verify-tag --generate-notes dist/*.zip dist/*.tar.gz dist/checksums.txt
